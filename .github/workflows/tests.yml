name: tests

# Runs every suite on each push and pull request, so anyone reading this repo can watch the
# contracts pass instead of taking the README's word for it.
#
# SIX suites:
#   commitment-vault  lock your own ERC-721, 7-365 days
#   token-locker      lock LP / any ERC-20, 7-1460 days
#   vesting-vault     linear vesting with cliff, non-revocable
#   dev-barter        EIP-712 signed NFT trades
#   adversarial       hostile collections attacking the four above
#   agent-preflight   isExecutable must ANSWER, never revert - the property that makes
#                     these contracts readable by software before a human signs

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Compile
        run: npx hardhat compile

      - name: CommitmentVault
        run: npx hardhat run test/commitment-vault.test.cjs

      - name: TokenLocker
        run: npx hardhat run test/token-locker.test.cjs

      - name: VestingVault
        run: npx hardhat run test/vesting-vault.test.cjs

      - name: DevBarter
        run: npx hardhat run test/dev-barter.test.cjs

      - name: Adversarial
        run: npx hardhat run test/adversarial.test.cjs

      - name: Agent preflight
        run: npx hardhat run test/agent-preflight.test.cjs
